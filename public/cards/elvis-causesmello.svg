      <circle cx="192" cy="36" r="5" fill="#1c1712" stroke="none"/>
      <path d="M206 52q16 4 22-6" />
      <path d="M40 90q-30 0-34 30" />
    </g>
    <text x="184" y="470" font-size="40" fill="#1c1712" stroke="none" transform="rotate(-8 184 470)">yap! yap!</text>
