    <rect x="600" y="278" width="86" height="66" rx="10" fill="#dff0ff"/>
    <line x1="572" y1="300" x2="600" y2="300"/>
    <circle cx="529" cy="311" r="6" fill="#1c1712" stroke="none"/>
    <circle cx="643" cy="311" r="6" fill="#1c1712" stroke="none"/>
    <path d="M560 388q28 20 56 0" />
    <!-- little yappy dog cockblocking -->
