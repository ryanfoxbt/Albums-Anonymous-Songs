<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="'Arial Black','Arial',sans-serif">
  <defs>
    <pattern id="check" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#f0e6d0"/>
      <rect width="60" height="60" fill="#e08fb0"/>
      <rect x="60" y="60" width="60" height="60" fill="#8ec98a"/>
