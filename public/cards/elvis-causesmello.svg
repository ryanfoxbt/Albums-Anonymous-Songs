  </defs>
  <rect width="1200" height="750" fill="url(#check)"/>
  <rect width="1200" height="750" fill="#5b8c3e" opacity=".12"/>
  <g stroke="#1c1712" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
